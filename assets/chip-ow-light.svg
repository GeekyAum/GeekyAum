<svg xmlns="http://www.w3.org/2000/svg" width="195" height="119" viewBox="0 0 195 119" role="img" aria-label="chip: OW."><title>chip: OW.</title><style>
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
