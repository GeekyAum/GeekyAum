ke="#30363d" stroke-width="1.5"/><path d="M135 51.0 L122 63.0 L135 65.0" fill="#161b22" stroke="#30363d" stroke-width="1.5" stroke-linejoin="round"/><rect x="134" y="52.0" width="3" height="12" fill="#161b22"/><text x="150" y="32.12" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start" >two state machines. in a calendar app.</text><text x="150" y="53.12" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start" >so nobody double-books a meeting room.</text><text x="150" y="74.12" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start" >i think about this more than a cricket</text><text x="150" y="95.11999999999999" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start" >reasonably should.</text></svg>
