<svg xmlns="http://www.w3.org/2000/svg" width="880" height="222" viewBox="0 0 880 222" role="img" aria-label="aum vyas: i build agents that are not allowed to make things up"><title>aum vyas: i build agents that are not allowed to make things up</title><style>
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.antL{transform-box:fill-box;transform-origin:100% 100%;animation:wig 2.4s ease-in-out infinite alternate}
.antR{transform-box:fill-box;transform-origin:0% 100%;animation:wig 2.4s ease-in-out infinite alternate-reverse}
@keyframes wig{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.hop{animation:hop 3.2s ease-in-out infinite}
@keyframes hop{0%,70%,100%{transform:translateY(0)}78%{transform:translateY(-7px)}86%{transform:translateY(0)}}
.z{animation:zz 3s ease-in infinite;opacity:0}
.z2{animation-delay:1.5s}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}25%{opacity:1}100%{opacity:0;transform:translate(10px,-22px)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.9}}
.cur{animation:cur 1s steps(1) infinite}
@keyframes cur{50%{opacity:0}}
</style><defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#d0d7de"/></pattern><clipPath id="type"><rect x="36" y="112" height="30" width="0"><animate attributeName="width" from="0" to="512" begin="0.4s" dur="2.6s" fill="freeze" calcMode="discrete" values="0;9;19;28;38;48;57;67;76;86;96;105;115;124;134;144;153;163;172;182;192;201;211;220;230;240;249;259;268;278;288;297;307;316;326;336;345;355;364;374;384;393;403;412;422;432;441;451;460;470;480;489;499;508"/></rect></clipPath></defs><rect x="1" y="1" width="878" height="220" rx="16" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><rect x="1" y="1" width="878" height="220" rx="16" fill="url(#dots)" opacity=".6"/><text x="34" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#1f2328" text-anchor="start" letter-spacing="-1.5">aum vyas</text><g clip-path="url(#type)"><text x="36" y="132" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="400" fill="#1a7f37" text-anchor="start" >i build agents that are not allowed to make things up</text></g><rect class="cur" y="118" width="9" height="18" fill="#1a7f37" x="36"><animate attributeName="x" values="36;45;55;64;74;84;93;103;112;122;132;141;151;160;170;180;189;199;208;218;228;237;247;256;266;276;285;295;304;314;324;333;343;352;362;372;381;391;400;410;420;429;439;448;458;468;477;487;496;506;516;525;535;544" begin="0.4s" dur="2.6s" fill="freeze" calcMode="discrete"/></rect><text x="36" y="174" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#59636e" text-anchor="start" >ai engineering · backend systems · iit bhubaneswar &#x27;27 · ex-google ai garage</text><rect x="548" y="14" width="234" height="82" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><path d="M742 95 L756 108 L758 95" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5" stroke-linejoin="round"/><rect x="743" y="93" width="14" height="4" fill="#f6f8fa"/><text x="564" y="40.04" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >hi. i&#x27;m chip, the resident</text><text x="564" y="59.54" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >cricket. he builds the</text><text x="564" y="79.03999999999999" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >agents. i heckle them.</text><g transform="translate(742 100) scale(0.95)"><g class="hop"><g class="antL"><path d="M50 34 C44 16 34 8 22 4" fill="none" stroke="#1f2328" stroke-width="3" stroke-linecap="round"/><circle cx="22" cy="4" r="3.5" fill="#4ac26b" stroke="#1f2328" stroke-width="2"/></g><g class="antR"><path d="M70 34 C76 16 86 8 98 4" fill="none" stroke="#1f2328" stroke-width="3" stroke-linecap="round"/><circle cx="98" cy="4" r="3.5" fill="#4ac26b" stroke="#1f2328" stroke-width="2"/></g><path d="M40 92 L16 70 L10 112" fill="none" stroke="#1f2328" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M40 92 L16 70 L10 112" fill="none" stroke="#1a7f37" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M80 92 L104 70 L110 112" fill="none" stroke="#1f2328" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M80 92 L104 70 L110 112" fill="none" stroke="#1a7f37" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M50 112 L46 121 M70 112 L74 121" stroke="#1f2328" stroke-width="3" stroke-linecap="round"/><ellipse cx="60" cy="92" rx="27" ry="23" fill="#4